# =============================================================================
# FranSCORE — 전체 파라미터 설정 (단일 진실 원천)
# KB 제8회 AI Challenge 프로토타입
#
# ⚠️ 정직성 원칙: 라벨 규칙·임계값은 모델 학습 *전*에 이 파일에 고정한다.
#    고정 시각: 2026-07-30 04:00 KST (git 최초 커밋으로 증빙)
#    학습 후 라벨 임계값을 바꾸는 행위(체리피킹)를 금지한다.
# =============================================================================

seed: 42

paths:
  raw: data/raw            # API/파일 원본 스냅샷 (재현성 — 절대 수정 금지)
  processed: data/processed
  outputs: outputs
  demo_outputs: outputs/_smoke   # 합성 스모크테스트 전용 (제출 지표 아님)

# -----------------------------------------------------------------------------
# M1 데이터 수집
# -----------------------------------------------------------------------------
collect:
  # data.go.kr 오픈API (serviceKey 필요 — env DATA_GO_KR_KEY)
  # ⚠️ 엔드포인트 목록(URL·연도 파라미터명·페이지크기·gzip 여부)은 **코드에 단일 정의**한다:
  #    src/collect.py 의 SERVICES 딕셔너리 (6종, 전부 실호출로 응답 스키마까지 검증한 값).
  #    설정과 코드에 같은 표를 이중으로 두면 어긋날 수 있어 여기에는 호출 정책만 남긴다.
  service_key_env: DATA_GO_KR_KEY
  max_retries: 5
  retry_backoff_sec: 2.0
  timeout_sec: 30

# -----------------------------------------------------------------------------
# M1.5 가맹본부 재무 (금융감독원 전자공시 OPEN DART) — src/dart.py
# -----------------------------------------------------------------------------
# ⚠️ 상장사 전용이 아니다. **외부감사 대상 법인**이면 비상장이어도 감사보고서를 낸다.
#    실측: 메가엠지씨커피·컴포즈커피·이디야·BHC·배스킨라빈스 등 주요 비상장 본부 모두 제출.
# ⚠️ 엔티티 정합은 법인명이 아니라 **사업자·법인등록번호 대조**로 확정한다.
#    실측(1,674건 후보): 확정 733 / 불일치 941 — 이름만 믿었으면 56%가 오매칭이었다.
dart:
  api_key_env: DART_API_KEY       # https://opendart.fss.or.kr 무료 발급
  # 학습 표본이 2017~2023 패널연도를 쓰고 피처는 회계연도 ≤ 패널연도−1 만 보므로,
  # 2020년부터만 모으면 과거 학습 연도가 통째로 결측이 된다(실측: 학습 표본 결합률 6.7%).
  fiscal_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # 피처가 쓰는 회계연도 상한 = 패널연도 - 1 (features.py 에 고정, 누출 테스트가 검사).
  # 회계연도 = 패널연도 도 형식상 누출은 아니지만 공시 시차가 해마다 흔들려 한 해 물린다.
  max_staleness_years: 3          # 최근 결산이 이보다 오래되면 결합하지 않는다

# -----------------------------------------------------------------------------
# M1.6 공정위 정보공개서 원문 (franchise.ftc.go.kr) — src/ifrmp.py
# -----------------------------------------------------------------------------
# ⚠️ data.go.kr 키와 **다른 키 체계**다 (data.go.kr 키는 INVALID_KEY 로 거절됨).
# ⚠️ 공개 데모키(sampleKey)는 본문(content)을 **고정 데모 1건**으로만 준다 —
#    ifrmp.py 가 응답 해시를 대조해 스스로 탐지하고 브랜드별 산출물을 만들지 않는다.
ifrmp:
  service_key_env: IFRMP_SERVICE_KEY
  year: 2023

# -----------------------------------------------------------------------------
# M1 표본 필터 (생존성 진단 후 완화 규칙 적용 가능 — 완화 사용 시 로그에 명시)
# -----------------------------------------------------------------------------
sample:
  industry_major: ["외식"]        # 업종 대분류
  min_stores: 30                  # 가맹점 수 하한 — t까지의 누적 최대 기준 (실시간·과거 정보만)
  min_consecutive_years: 3        # t에서 끝나는 연속 관측 연수 하한 (실시간·과거 정보만)
  winsorize_pct: 0.01             # 상하위 1% winsorize (매출 등 연속형)
  drop_zero_sales: true           # 평균매출 0/미기재 제외
  # 플랜B / 확장 표본 (명세 §11 "표본 조건 완화(점포20+/도소매 포함)")
  # ⚠️ 체리피킹 방지: 확장 트랙은 **사전 선언된 별도 트랙**이며, 두 결과를 모두 공개한다.
  #    기본(primary) = 명세 표본(외식·점포30+), 확장(extended) = 전 업종·점포20+.
  #    둘 중 좋은 쪽만 골라 보고하지 않는다.
  relaxed:
    min_stores: 20
    industry_major: ["외식", "도소매", "서비스"]

# -----------------------------------------------------------------------------
# M2 라벨: "현재 양호 브랜드의 미래 악화 *전환*" (persistence 함정 회피)
# -----------------------------------------------------------------------------
label:
  # '현재 양호(t)' 게이트: t년에 아래 악화사건이 하나도 발동하지 않은 브랜드만 표본
  healthy_gate_at_t: true
  # 악화 사건 3종 (t+1년 기준, 업종 내 분위수)
  events:
    store_net_decline:            # ① 가맹점 순감률(신규-종료 반영 순증감률) 업종 하위 20%
      metric: store_growth_rate
      quantile: 0.20
      side: lower
    sales_decline:                # ② 실질 평균매출 증가율 업종 하위 20%
      metric: real_sales_growth
      quantile: 0.20
      side: lower
    contract_end_spike:           # ③ 계약종료율(종료+해지/전년점포) 업종 상위 20%
      metric: contract_end_rate
      quantile: 0.80
      side: upper
  # 발동 규칙: 2개 이상 or 1개 극단(하위/상위 5%)
  min_events: 2
  extreme_quantile: 0.05
  # 노이즈 게이트
  min_abs_store_change: 3         # 순감 최소 절대 점포수
  min_stores_at_t: 10             # t 시점 최소 점포수 (분모 안정성)
  # 실질화: 평균매출 증가율에서 차감할 연도별 물가/업종평균 (업종 중앙값 사용)
  deflate_by: industry_median

# -----------------------------------------------------------------------------
# M3 모델 & 검증
# -----------------------------------------------------------------------------
split:
  # 완전 시간분할. 실데이터 연도 범위 확인 후 아래 auto 규칙으로 결정:
  # test = 마지막 라벨연도, valid = 그 전 해, train = 나머지 전부
  mode: auto_last_two
  # 데이터 연도가 확정되면 명시값으로 고정 (auto와 일치해야 함)
  train_end: null
  valid_year: null
  test_year: null

model:
  lightgbm:
    n_estimators: 500
    num_leaves: 31
    max_depth: -1
    learning_rate: 0.03
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_lambda: 1.0
    is_unbalance: true
    random_state: 42
    verbosity: -1
  early_stopping_rounds: 50
  # 복잡도 후보 (사전 선언). **valid 분할의 AUC로만 선택하고 test는 절대 쓰지 않는다.**
  # 소표본(n≈2~6천, 양성 ~10%)에서 num_leaves=31은 과도하게 복잡하므로 후보에 단순 모형을 포함.
  # 그리드서치가 아니라 3개 사전 후보 중 검증 기반 선택 — 명세 "과튜닝 금지" 준수.
  complexity_candidates:
    - {num_leaves: 7,  min_child_samples: 40}
    - {num_leaves: 15, min_child_samples: 30}
    - {num_leaves: 31, min_child_samples: 20}
  logistic:                       # 기준모형 ③
    C: 1.0
    max_iter: 2000
    class_weight: balanced

baselines:                        # 기준모형 3종 (명세 4.1)
  - persistence                   # ① 전년 상태 유지
  - single_var_contract_end       # ② 전년 계약종료율 단일변수
  - logistic                      # ③ 로지스틱 회귀

evaluate:
  k_pct: 0.10                     # Lift@10%, Precision@10%
  calibration_method: isotonic    # 표본 작으면 sigmoid(Platt)로 자동 전환
  calibration_min_samples: 300
  n_bins_calibration: 10
  bootstrap_n: 200                # COULD: 신뢰구간
  # PD 상·하한 — isotonic 보정은 계단함수라 양 끝이 검증표본 경험률로 포화된다
  # (실측: 정확히 1.000 / 1.4e-08 까지 발생). 1년 악화확률 "100%"·"7천만분의 1"은
  # 수십 건의 관측이 뒷받침할 수 없는 추정이고 EL 계산까지 과신하게 만든다.
  # 여신 실무의 PD 하한(바젤 IRB 0.03%) 관행을 따른다. **단조 클립이라 순위는 불변** —
  # Lift@k·PR-AUC 등 순위 지표는 그대로이고 Brier·EL만 보수화된다.
  prob_floor: 0.0003
  prob_cap: 0.99

# -----------------------------------------------------------------------------
# M4 포트폴리오 (예시 여신 — 합성 exposure임을 화면·문서에 명시)
# -----------------------------------------------------------------------------
portfolio:
  n_brands_sampled: 60            # 예측 대상 브랜드 중 예시 포트폴리오 편입 수
  # ── 여신 익스포저 산출 (우선순위: 실제여신 → 공시 창업비용 → 합성) ──
  # ① 은행 내부에서 돌릴 때: 아래에 CSV 경로만 채우면 실제 여신으로 전환된다.
  #    필요 컬럼 brand_id(또는 brand_name) + exposure_mkrw [+ n_borrowers]
  exposure_source: null
  # ② 기본값 — 공정위 공시 창업비용(15110265) 실측 기반:
  #      exposure = 가맹점수 × 창업비용 × loan_to_startup_cost × bank_share
  #    창업비용·가맹점수는 **실측**이고, 아래 두 비율만 가정이다.
  #    실제 여신 잔액은 은행 내부 자료라 공개 데이터에 존재하지 않는다.
  loan_to_startup_cost: 0.6       # 창업비용 중 대출로 조달하는 비율 (자기자본 40% 가정)
  bank_share: 0.15                # 그 대출 중 한 은행이 취급하는 몫 (시중은행 다수 경쟁 가정)
  # ③ 창업비용 원천이 전혀 없을 때만 쓰는 합성 폴백 파라미터
  exposure_scale_per_store_mkrw: 50
  exposure_lognorm_sigma: 0.5
  lgd_scenarios: [0.3, 0.45, 0.6] # 손실률(LGD) 시나리오 저/중/고
  stress_top_pct: 0.10            # 스트레스: 위험 상위 10% 동시 악화
  stress_pd_multiplier: 1.5
  risk_grades:                    # 점수 → 등급 컷 (보정확률 분위수 기준)
    high: 0.90                    # 상위 10%
    medium: 0.70                  # 상위 30%

# -----------------------------------------------------------------------------
# M4 LLM (뉴스 신호·심사메모) — 점수 미투입 (누출·재현성 원칙)
# -----------------------------------------------------------------------------
llm:
  provider: google_gemini
  api_key_env: GEMINI_API_KEY
  api_base: "https://generativelanguage.googleapis.com/v1beta"
  # 모델 고정(pin). 별칭(gemini-flash-latest)은 시점에 따라 실체가 바뀌어 재현성을 해치므로 쓰지 않는다.
  # **정량 평가를 통과한 모델을 그대로 운영에 쓴다** — outputs/llm_eval.json 이 이 모델로
  # 측정한 결과다(정확도 0.966 / 위험 재현율 1.000, 규칙기반 0.475 대비).
  # gemini-3.6-flash 도 동일 클라이언트로 동작하나 무료 등급 일일 쿼터가 빨리 소진돼
  # 평가를 완주하지 못했다. 측정하지 않은 모델을 운영에 쓰지 않는다는 원칙에 따라 2.5-flash 고정.
  model: gemini-2.5-flash
  # ⚠️ 위 모델은 **신규 프로젝트에 더 이상 제공되지 않는다** (실측: 새로 만든 프로젝트의
  #    키는 404 "no longer available to new users", 같은 키가 아래 모델에는 200).
  #    핀을 이 별칭으로 바꾸면 평가한 모델과 운영 모델이 갈리므로 바꾸지 않는다.
  #    등록된 키가 **하나도** 위 모델을 못 쓸 때에 한해 여기로 내려간다(한도 초과나
  #    인증 실패로는 내려가지 않는다). 그때는 화면이 "평가한 모델이 아니다"라고 밝힌다.
  fallback_models: [gemini-flash-latest]
  # ⚠️ Gemini는 사고(thinking) 토큰도 이 예산에 포함된다.
  # 8000 이었는데 **두 브랜드를 비교하는 질문에서 매번 잘렸다** — 실측: 본문 7,964자를
  # 쓰다 finishReason=MAX_TOKENS. 잘린 답은 신뢰할 수 없어 폴백으로 떨어지므로,
  # 화면에는 "문제가 발생했습니다"만 남고 정작 답은 나가지 않았다.
  # 이 값은 목표가 아니라 **상한**이다 — 8000 안에 들어오던 답의 출력은 그대로이고
  # (같은 입력·같은 온도), 죽던 긴 답만 끝까지 쓸 수 있게 된다.
  max_tokens: 16000
  temperature: 0.0                # 재현성 우선 (완전 결정적은 아님 — 산출물은 스냅샷으로 보존)
  # thinking: {thinkingLevel: low}  # (선택) 모델별 사고 예산 파라미터를 그대로 전달. 기본은 모델 기본값.
  max_retries: 6                  # 429/5xx 지수 백오프 재시도 (무료 등급 분당 한도 대응)
  retry_backoff_sec: 4.0
  timeout_sec: 90
  eval_pace_sec: 8.0              # 평가 시 브랜드 배치 간 대기 — 분당 요청 한도 회피
  news:
    # 원천 우선순위: 네이버 검색 API(키 있으면) → Google News RSS(항상, 보완)
    # 네이버를 먼저 쓰는 이유: RSS 는 **제목만** 주지만 네이버는 본문 요약(description)을
    # 함께 준다. 제목 한 줄로 '본부 분쟁'과 '신메뉴 홍보'를 가르는 데 한계가 뚜렷하다.
    # 비용: 무료. 일 25,000회 **호출 한도**가 있을 뿐 과금이 아니다.
    # 키: developers.naver.com → 애플리케이션 등록 → 검색 API
    naver_client_id_env: NAVER_CLIENT_ID
    naver_client_secret_env: NAVER_CLIENT_SECRET
    source: google_news_rss       # 키 불필요 (폴백 겸 보완 원천)
    max_articles_per_brand: 8
    query_suffixes: ["가맹점", "본사 분쟁", "폐점", "가맹 갈등"]
    cache_dir: data/raw/news      # 스냅샷 보존
    max_age_months: 24            # 시의성 — 이보다 오래된 기사는 조기경보로 쓰지 않는다
    # 뉴스 수집 대상 선정 하한. 위험 상위만 고르면 영세·무명 브랜드가 뽑혀 언론 보도 자체가
    # 없다(실측: 262건 중 위험 이벤트 0건). 조기경보가 성립하려면 '보도가 존재할 규모'와
    # '위험이 높음'을 함께 만족해야 한다.
    min_stores_for_news: 100
  score_injection: false          # ⚠️ 뉴스 신호는 모델 점수에 미반영 (화면 표시 전용)

# -----------------------------------------------------------------------------
# 네이버 오픈API — 검색어트렌드(수요)·뉴스·지역검색 (src/naver.py)
# -----------------------------------------------------------------------------
# 발급: developers.naver.com → 애플리케이션 등록 → '검색' + '데이터랩(검색어트렌드)' 추가
# 무료. 일 25,000회 호출 한도(과금 아님).
# ⚠️ 데이터랩은 절대 검색량을 주지 않는다 — 기간 내 최대=100 인 **상대지수**다.
#    그래서 산출물은 '검색량 N건'이 아니라 항상 증감률만 담는다.
naver:
  client_id_env: NAVER_CLIENT_ID
  client_secret_env: NAVER_CLIENT_SECRET
  demand_top_n: 300               # 규모×위험 상위 N개 브랜드의 수요를 수집
  trend_months: 24                # 최근 12개월 vs 직전 12개월 비교 → 계절성 상쇄

# -----------------------------------------------------------------------------
# 브랜드 개별 진단 (src/diagnosis.py)
# -----------------------------------------------------------------------------
# 소견은 규칙 기반이며 문장 속 수치는 전부 해당 브랜드의 공시·감사보고서 실측값이다.
# 감시점수 = det_component(백테스트 검증 모델 순위) + rule_component(규칙 가산).
# 두 성분을 산출물에 분리 기록해 어디까지가 검증된 부분인지 드러낸다.
diagnosis:
  plateau_tol: 0.0001             # 이보다 가까운 보정확률은 같은 계단으로 보고 내부를 보간
  max_findings_display: 6         # 화면에 기본 노출할 소견 수 (나머지는 접어둔다)
